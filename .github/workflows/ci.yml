name: LMS Professional CI/CD Pipeline

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]

jobs:
  # ==========================================
  # STAGE 1: CI (Linting & Testing) - Runs on both branches
  # ==========================================
  continuous-integration:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Checkout Code
      uses: actions/checkout@v4

    - name: 2. Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 3. Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest flake8

    - name: 4. Lint Code (Quality Check)
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: 5. Run Automated Tests
      run: python -m pytest tests/test_app.py

  # ==========================================
  # STAGE 2: DEPLOY TO STAGING (Only for Development Branch)
  # ==========================================
  deploy-staging:
    needs: continuous-integration
    if: github.ref == 'refs/heads/development' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Staging Server
      run: |
        echo "Deploying to STAGING environment..."
        echo "Code tested successfully in Development branch."
        echo "Staging Deployment Complete!"

  # ==========================================
  # STAGE 3: DEPLOY TO PRODUCTION (Only for Main Branch)
  # ==========================================
  deploy-production:
    needs: continuous-integration
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Production Server
      run: |
        echo "🚀 Deploying to PRODUCTION (Live) environment..."
        echo "Code is stable and merged into Main branch."
        echo "Production Deployment Complete!"
        