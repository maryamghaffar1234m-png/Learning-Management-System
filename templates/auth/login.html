<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-circle"><i class="fas fa-graduation-cap"></i></div>
                <h2>Welcome to LMS</h2>
                <p>Login to access your dashboard</p>
            </div>
            <form action="/" method="POST">
                <div class="input-group">
                    <label>Email Address <span class="required">*</span></label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" name="email" placeholder="Enter your email" required>
                    </div>
                </div>
                <div class="input-group">
                    <label>Password <span class="required">*</span></label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" placeholder="Enter your password" required>
                    </div>
                </div>
                <div class="input-group">
                    <label>Login As <span class="required">*</span></label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-user-tag"></i>
                        <select name="role" required style="width: 100%; padding: 13px 15px 13px 45px; border: 1.5px solid #cbd5e1; border-radius: 10px; background: #f8fafc; outline: none;">
                            <option value="student">Student</option>
                            <option value="teacher">Teacher</option>
                        </select>
                    </div>
                </div>
                <div class="form-options">
                    <label class="remember-me"><input type="checkbox"> Remember me</label>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Login <i class="fas fa-arrow-right"></i></button>
            </form>
            <div style="text-align: center; margin-top: 15px; font-size: 14px;">
                <p>Don't have an account? <a href="/signup" style="color: #0284c7; text-decoration: none; font-weight: 600;">Sign Up</a></p>
            </div>
        </div>
    </div>
</body>
</html>
