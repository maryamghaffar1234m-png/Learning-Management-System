<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LMS - Sign Up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-circle"><i class="fas fa-user-plus"></i></div>
                <h2>Create Account</h2>
                <p>Join the Learning Management System</p>
            </div>
            <form action="/signup" method="POST">
                <div class="input-group">
                    <label>Full Name <span class="required">*</span></label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" name="name" placeholder="Enter your full name" required>
                    </div>
                </div>
                <div class="input-group">
                    <label>Email Address <span class="required">*</span></label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" name="email" placeholder="Enter your email" required>
                    </div>
                </div>
                <div class="input-group">
                    <label>Password <span class="required">*</span></label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" placeholder="Create a password" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Sign Up <i class="fas fa-check"></i></button>
            </form>
            <div style="text-align: center; margin-top: 15px; font-size: 14px;">
                <p>Already have an account? <a href="/" style="color: #0284c7; text-decoration: none; font-weight: 600;">Login</a></p>
            </div>
        </div>
    </div>
</body>
</html>
