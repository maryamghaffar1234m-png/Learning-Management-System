<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Course</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="sidebar">
        <h2><i class="fas fa-graduation-cap"></i> LMS Admin</h2>
        <a href="/courses"><i class="fas fa-arrow-left"></i> Back to Courses</a>
    </div>
    <div class="main-content">
        <h1>Edit Course: {{ course['title'] }}</h1>
        <div class="section-box" style="max-width: 600px; margin-top: 20px;">
            <form action="/courses/edit/{{ course['id'] }}" method="POST">
                <div class="input-group">
                    <label>Course Title <span class="required">*</span></label>
                    <input type="text" name="title" value="{{ course['title'] }}" required style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px;">
                </div>
                <div class="input-group">
                    <label>Description <span class="required">*</span></label>
                    <textarea name="description" required style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; height: 100px;">{{ course['description'] }}</textarea>
                </div>
                <div class="input-group">
                    <label>Instructor Name <span class="required">*</span></label>
                    <input type="text" name="teacher_name" value="{{ course['teacher_name'] }}" required style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px;">
                </div>
                <button type="submit" class="btn-primary" style="margin-top: 10px; background: #f59e0b;">Update Course</button>
            </form>
        </div>
    </div>
</body>
</html>
