<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="sidebar">
        <h2><i class="fas fa-graduation-cap"></i> LMS Admin</h2>
        <a href="/courses" class="active"><i class="fas fa-book"></i> Manage Courses</a>
        <a href="/"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
    <div class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Course Management</h1>
            <a href="/courses/create" class="btn-primary" style="width: auto; padding: 10px 20px;"><i class="fas fa-plus"></i> Create New Course</a>
        </div>
        
        <div class="card-container" style="margin-top: 20px;">
            {% for course in courses %}
            <div class="card">
                <h3>{{ course['title'] }}</h3>
                <p><i class="fas fa-chalkboard-teacher"></i> {{ course['teacher_name'] }}</p>
                <p style="font-size: 13px; color: #64748b;">{{ course['description'][:60] }}...</p>
                <div style="margin-top: 15px; display: flex; gap: 10px;">
                    <a href="/courses/{{ course['id'] }}" class="btn-sm" style="background:#0284c7;"><i class="fas fa-eye"></i> View</a>
                    <a href="/courses/edit/{{ course['id'] }}" class="btn-sm" style="background:#f59e0b;"><i class="fas fa-edit"></i> Edit</a>
                    <form action="/courses/delete/{{ course['id'] }}" method="POST" style="margin: 0;">
                        <button type="submit" class="btn-sm" style="background:#ef4444; border:none; cursor:pointer;"><i class="fas fa-trash"></i></button>
                    </form>
                </div>
            </div>
            {% else %}
            <p>No courses found. Create one!</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
